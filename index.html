    <style type="text/tailwindcss">
        @layer theme {
        :root {
            --primary-color: #2563eb;
            --secondary-color: #f1f5f9;
            --accent-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --sidebar-width: 280px;
        }
    }

    @layer base {
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: var(--text-primary);
        }
    }

    @layer components {
        .btn {
            @apply px-4 py-2 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2;
        }
        
        .btn-primary {
            @apply bg-[var(--primary-color)] text-white hover:bg-blue-700 focus:ring-[var(--primary-color)];
        }
        
        .btn-secondary {
            @apply bg-[var(--secondary-color)] text-[var(--text-primary)] hover:bg-slate-200 focus:ring-slate-300;
        }
        
        .btn-success {
            @apply bg-[var(--accent-color)] text-white hover:bg-green-600 focus:ring-[var(--accent-color)];
        }
        
        .btn-danger {
            @apply bg-[var(--danger-color)] text-white hover:bg-red-600 focus:ring-[var(--danger-color)];
        }
        
        .btn-warning {
            @apply bg-[var(--warning-color)] text-white hover:bg-yellow-600 focus:ring-[var(--warning-color)];
        }

        .card {
            @apply bg-white rounded-xl shadow-sm border border-[var(--border-color)] p-6;
        }

        .input-field {
            @apply w-full px-4 py-2 border border-[var(--border-color)] rounded-lg focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-transparent;
        }

        .sidebar-item {
            @apply flex items-center gap-3 px-4 py-3 rounded-lg cursor-pointer transition-all duration-200 hover:bg-[var(--secondary-color)];
        }

        .sidebar-item.active {
            @apply bg-[var(--primary-color)] text-white;
        }

        .attendance-btn {
            @apply px-3 py-1 rounded text-sm font-medium transition-all duration-200;
        }

        .attendance-present {
            @apply bg-green-100 text-green-800 hover:bg-green-200;
        }

        .attendance-late {
            @apply bg-yellow-100 text-yellow-800 hover:bg-yellow-200;
        }

        .attendance-absent {
            @apply bg-red-100 text-red-800 hover:bg-red-200;
        }

        .attendance-excuse {
            @apply bg-purple-100 text-purple-800 hover:bg-purple-200;
        }
    }
    </style>
